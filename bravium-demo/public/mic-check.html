<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bravium Microphone Test</title>

    <style>
      body {
        background: #101820;
        color: #a4f4d9;
        font-family: Arial, sans-serif;
        padding: 30px;
        text-align: center;
      }

      button {
        background: #a4f4d9;
        color: #101820;
        border: none;
        border-radius: 12px;
        padding: 18px 25px;
        font-size: 18px;
        margin: 25px 0;
      }

      button:disabled {
        opacity: 0.5;
      }

      pre {
        background: #1c2932;
        padding: 20px;
        border-radius: 12px;
        text-align: left;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
    </style>
  </head>

  <body>
    <h2>BRAVIUM — MICROPHONE TEST</h2>

    <p>Press the button and speak continuously for 5 seconds.</p>

    <button id="testButton">Test Microphone</button>

    <pre id="result">Ready to test.</pre>

    <script>
      const button = document.getElementById("testButton");
      const output = document.getElementById("result");

      button.addEventListener("click", async () => {
        button.disabled = true;

        let stream = null;
        let audioContext = null;

        try {
          if (!navigator.mediaDevices?.getUserMedia) {
            output.textContent = "capture=no\nerror=getUserMedia_unsupported";
            return;
          }

          const AudioContextClass =
            window.AudioContext || window.webkitAudioContext;

          if (AudioContextClass) {
            audioContext = new AudioContextClass();

            if (audioContext.state === "suspended") {
              audioContext.resume().catch(() => {});
            }
          }

          output.textContent = "Requesting microphone permission...";

          stream = await navigator.mediaDevices.getUserMedia({
            audio: true,
            video: false,
          });

          output.textContent =
            "capture=yes\nTesting audio...\nPlease speak for 5 seconds.";

          if (!audioContext) {
            output.textContent =
              "capture=yes\nsound=unknown\nreason=AudioContext unsupported";
            return;
          }

          if (audioContext.state === "suspended") {
            audioContext.resume().catch(() => {});
            await new Promise((resolve) => setTimeout(resolve, 500));
          }

          if (audioContext.state !== "running") {
            output.textContent =
              "capture=yes\nsound=unknown\nreason=AudioContext not running";
            return;
          }

          const analyser = audioContext.createAnalyser();
          analyser.fftSize = 1024;

          const source = audioContext.createMediaStreamSource(stream);
          source.connect(analyser);

          const data = new Uint8Array(analyser.fftSize);

          let maxLevel = 0;

          for (let i = 0; i < 50; i++) {
            analyser.getByteTimeDomainData(data);

            for (const value of data) {
              const level = Math.abs(value - 128);

              if (level > maxLevel) {
                maxLevel = level;
              }
            }

            await new Promise((resolve) => setTimeout(resolve, 100));
          }

          output.textContent =
            "capture=yes\n" +
            "sound=" +
            (maxLevel >= 4 ? "yes" : "no") +
            "\n" +
            "level=" +
            maxLevel;
        } catch (error) {
          output.textContent =
            "capture=" +
            (stream ? "yes" : "no") +
            "\n" +
            "sound=unknown\n" +
            "error=" +
            (error.name || "unknown") +
            "\n" +
            "message=" +
            (error.message || "");
        } finally {
          if (stream) {
            stream.getTracks().forEach((track) => track.stop());
          }

          if (audioContext) {
            try {
              await audioContext.close();
            } catch {}
          }

          button.disabled = false;
        }
      });
    </script>
    <hr style="margin-top: 30px" />

    <h3>P03.6 — Speech Track Test</h3>

    <p>Press the button and say: Hello Bravium</p>

    <button id="speechTrackButton">Test Speech Recognition</button>

    <pre id="speechTrackResult">Ready.</pre>

    <script>
      const speechButton = document.getElementById("speechTrackButton");
      const speechOutput = document.getElementById("speechTrackResult");

      speechButton.addEventListener("click", async () => {
        speechButton.disabled = true;

        let stream = null;
        let recognition = null;
        let timeout = null;
        let finished = false;

        let started = false;
        let audioStarted = false;
        let speechDetected = false;

        function finish(message) {
          if (finished) return;
          finished = true;

          clearTimeout(timeout);

          speechOutput.textContent =
            message +
            "\n" +
            "start=" +
            (started ? "yes" : "no") +
            "\n" +
            "audio=" +
            (audioStarted ? "yes" : "no") +
            "\n" +
            "speech=" +
            (speechDetected ? "yes" : "no");

          try {
            recognition?.abort();
          } catch {}

          stream?.getTracks().forEach((track) => track.stop());

          speechButton.disabled = false;
        }

        try {
          speechOutput.textContent = "Opening microphone...";

          stream = await navigator.mediaDevices.getUserMedia({
            audio: true,
          });

          const Recognition =
            window.SpeechRecognition || window.webkitSpeechRecognition;

          if (!Recognition) {
            finish("recognition=unsupported");
            return;
          }

          recognition = new Recognition();

          recognition.lang = "en-US";
          recognition.continuous = false;
          recognition.interimResults = false;

          recognition.onstart = () => {
            started = true;
            speechOutput.textContent = "Listening...";
          };

          recognition.onaudiostart = () => {
            audioStarted = true;
          };

          recognition.onspeechstart = () => {
            speechDetected = true;
          };

          recognition.onspeechend = () => {
            try {
              recognition.stop();
            } catch {}
          };

          recognition.onresult = (event) => {
            const transcript = Array.from(event.results)
              .map((result) => result[0]?.transcript || "")
              .join(" ")
              .trim();

            finish("transcript=" + transcript);
          };

          recognition.onerror = (event) => {
            finish("error=" + event.error);
          };

          recognition.onend = () => {
            finish("ended_without_transcript");
          };

          const audioTrack = stream.getAudioTracks()[0];

          recognition.start(audioTrack);

          timeout = setTimeout(() => {
            finish("recognition_timeout");
          }, 12000);
        } catch (error) {
          finish(
            "error=" +
              (error.name || "unknown") +
              "\nmessage=" +
              (error.message || ""),
          );
        }
      });
    </script>
  </body>
</html>
